name: Build and deploy containers
run-name: Deploy containers
on:
  workflow_dispatch:
  push:
    branches: [release]

jobs:
  publish:
    concurrency:
      group: ${{ github.ref }}-docker
      queue: 'max'
    permissions:
      # allow issuing OIDC tokens for this job
      id-token: write
      # allow for reading the repo contents
      contents: read
      # Allow for pushing to packages
      packages: write
      # Allow for writing attestations for attest action.
      attestations: write
      # Allow for writing artifact metadata for attest action.
      artifact-metadata: write

    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag:
          - 18.17.1
          - 18.18.1
          - 18.19.0
          - 18.19.0-nocurl
          - main
          - main-nocurl
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get and set build information
        id: info
        run: |
          echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "source_date_epoch=$(date --date="$(date --iso-8601=hours)" +%s)" >> $GITHUB_OUTPUT
          echo "is_release=${{ github.ref == 'refs/heads/release' }}" >> $GITHUB_OUTPUT
          echo "suffix=$(jq -r '.containerTags."${{ matrix.tag }}".suffix' ./atuin-build-info.json)" >> $GITHUB_OUTPUT
          echo "has_alias=$(jq -r '.containerTags."${{ matrix.tag }}".hasAlias' ./atuin-build-info.json)" >> $GITHUB_OUTPUT
          echo "alias=$(jq -r '.containerTags."${{ matrix.tag }}".alias' ./atuin-build-info.json)" >> $GITHUB_OUTPUT
          echo 'info<<EOF' >> $GITHUB_OUTPUT
          jq '.containerTags."${{ matrix.tag }}"' ./atuin-build-info.json >> $GITHUB_OUTPUT
          echo -e '\nEOF' >> $GITHUB_OUTPUT

      - name: Checkout atuin repo
        if: ((github.event_name == 'push') && fromJson(steps.info.outputs.info).build) || fromJson(steps.info.outputs.info).buildOnRequest
        id: checkout_atuin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: atuinsh/atuin
          ref: ${{ fromJson(steps.info.outputs.info).atuinTag }}
          path: context/atuin
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Output to summary
        if: steps.checkout_atuin.outcome == 'success'
        id: atuin_info
        run: |
          cd context/atuin
          echo "version=$( git describe --tags | sed -e 's/^v//' )${{ steps.info.outputs.suffix }}" >> $GITHUB_OUTPUT
          echo "oci_version=$( git describe --tags | sed -e 's/^v//' )" >> $GITHUB_OUTPUT
          echo -e "## Build information summary\nBuilding container for atuin version $( git describe --tags )\n\n" >> $GITHUB_STEP_SUMMARY
          cd ../..

      - name: Output to summary
        if: steps.checkout_atuin.outcome == 'skipped'
        id: skipping
        run: |
          echo -e "## Build information summary\n Skipping build for container tag ${{ matrix.tag }}\n\n" >> $GITHUB_STEP_SUMMARY

      # This has to be done so atuin-tiny's can be used.
      # - name: Remove atuin depot.json
      #   if: ((github.event_name == 'push') && fromJson(steps.info.outputs.info).build) || fromJson(steps.info.outputs.info).buildOnRequest
      #   run: rm context/atuin/depot.json

      - name: Setup Depot
        if: steps.checkout_atuin.outcome == 'success'
        id: depot-setup
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Login to container Registry
        if: steps.depot-setup.outcome == 'success'
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Docker meta
        if: steps.ghcr-login.outcome == 'success'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ steps.info.outputs.repo_owner }}/atuin-tiny
          flavor: |
            latest=false
          tags: |
            type=raw,priority=950,value=latest-${{ steps.atuin_info.outputs.version }},enable={{is_default_branch}}
            type=raw,priority=949,value={{branch}}-${{ steps.atuin_info.outputs.version }},enable={{is_not_default_branch}}
            type=raw,priority=948,value=latest${{ steps.info.outputs.alias || '' }},enable=${{ steps.info.outputs.has_alias && steps.info.outputs.is_release }}
            type=sha,prefix=g,suffix=-${{ steps.atuin_info.outputs.version }}
          annotations: |
            org.opencontainers.image.source=https://github.com/csjewell/atuin-tiny
            org.opencontainers.image.url=https://atuin.sh
            org.opencontainers.image.authors=Curtis Jewell and other contributors, including Atuin project contributors
            org.opencontainers.image.version=${{ steps.atuin_info.outputs.oci_version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.title=Tiny Atuin Server
            org.opencontainers.image.description=Tiny version of Atuin server image
          labels: |
            org.opencontainers.image.source=https://github.com/csjewell/atuin-tiny
            org.opencontainers.image.url=https://atuin.sh
            org.opencontainers.image.authors=Curtis Jewell and other contributors, including Atuin project contributors
            org.opencontainers.image.version=${{ steps.atuin_info.outputs.oci_version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.title=Tiny Atuin Server
            org.opencontainers.image.description=Tiny version of Atuin server image

      - name: Build and push
        if: steps.meta.outcome == 'success'
        id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.info.outputs.source_date_epoch }}
        with:
          project: krf5nlz8bs
          outputs: |
            type=registry,push=true,oci-mediatypes=true,rewrite-timestamp=true,compress=estargz,force-compression=true
          platforms: linux/amd64,linux/arm64
          file: ./${{ fromJson(steps.info.outputs.info).containerfile }}
          context: context
          provenance: mode=max,version=v1
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest
        if: steps.build.outcome == 'success'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/csjewell/atuin-tiny
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # I'm not creating an org for this repo. If I was, we could do this.
          create-storage-record: false

